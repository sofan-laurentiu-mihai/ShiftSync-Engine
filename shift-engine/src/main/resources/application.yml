spring:
  application:
    name: shift-engine

  # Connection to PostgreSQL from Docker
  datasource:
    url: jdbc:postgresql://localhost:5432/shiftsync_db
    username: shiftsync_user
    password: shiftsync_pass
    driver-class-name: org.postgresql.Driver

  # The settings for JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Connection to PostgreSQL from Docker
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: shiftsync-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.shiftsync.*"

server:
  port: 8080